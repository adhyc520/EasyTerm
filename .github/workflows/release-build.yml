# 推送版本 tag（如 v0.0.3）后自动构建桌面产物并发布 GitHub Release。
# tag 即发布版本号；产物名为 easyterm-{tag}-windows-x64.zip / easyterm-{tag}-macos-arm64.zip。
# - Windows x64（amd64）
# - macOS Apple Silicon（arm64）
name: Release build

on:
  push:
    tags:
      - "v*"

# 构建 job 仅需读仓库；发布 Release 的 job 单独授予 contents: write
permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Set app version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v0.0.3 (got: $TAG)" >&2
            exit 1
          fi
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "APP_TAG=$TAG" >> "$GITHUB_ENV"

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      # Default shell on this runner is pwsh; use $env:VAR (bash $VAR is empty there).
      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --build-name "$env:APP_VERSION" --build-number "$env:GITHUB_RUN_NUMBER"

      - name: Pack
        shell: pwsh
        run: |
          $out = "easyterm-${{ github.ref_name }}-windows-x64.zip"
          tar -a -c -f $out -C build/windows/x64/runner/Release .

      - uses: actions/upload-artifact@v4
        with:
          name: easyterm-${{ github.ref_name }}-windows-x64
          path: easyterm-${{ github.ref_name }}-windows-x64.zip

  build-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Set app version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v0.0.3 (got: $TAG)" >&2
            exit 1
          fi
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "APP_TAG=$TAG" >> "$GITHUB_ENV"

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Pack
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/easyterm-${{ github.ref_name }}-macos-arm64.zip" EasyTerm.app

      - uses: actions/upload-artifact@v4
        with:
          name: easyterm-${{ github.ref_name }}-macos-arm64
          path: easyterm-${{ github.ref_name }}-macos-arm64.zip

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: easyterm-${{ github.ref_name }}-windows-x64
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: easyterm-${{ github.ref_name }}-macos-arm64
          path: release-assets

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
