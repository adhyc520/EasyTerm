# 推送版本 tag（如 v1.0.0）后自动构建桌面产物：
# - Windows x64（amd64）
# - macOS Apple Silicon（arm64）
name: Release build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Pack
        shell: pwsh
        run: |
          $out = "terminall-${{ github.ref_name }}-windows-x64.zip"
          tar -a -c -f $out -C build/windows/x64/runner/Release .

      - uses: actions/upload-artifact@v4
        with:
          name: terminall-${{ github.ref_name }}-windows-x64
          path: terminall-${{ github.ref_name }}-windows-x64.zip

  build-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Pack
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/terminall-${{ github.ref_name }}-macos-arm64.zip" terminall.app

      - uses: actions/upload-artifact@v4
        with:
          name: terminall-${{ github.ref_name }}-macos-arm64
          path: terminall-${{ github.ref_name }}-macos-arm64.zip
