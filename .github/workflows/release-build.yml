# 推送版本 tag（如 v0.0.3）后自动构建桌面产物并发布 GitHub Release。
# tag 即发布版本号；产物名为 easyterm-{tag}-windows-x64.zip / easyterm-{tag}-macos-arm64.zip。
# - Windows x64（amd64）
# - macOS Apple Silicon（arm64）
name: Release build

on:
  push:
    tags:
      - "v*"

# 构建 job 仅需读仓库；发布 Release 的 job 单独授予 contents: write
permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

# Pin Flutter so a same-day stable bump cannot break a release mid-flight.
# Bump intentionally when ready to adopt a newer SDK.
env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-windows:
    name: Windows (x64)
    # Prefer VS2022 image: windows-2025 / windows-latest now ship VS2026, and the
    # temporary windows-2025-vs2026 label is for migration testing only.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-sdk: true

      - name: Set app version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v0.0.3 (got: $TAG)" >&2
            exit 1
          fi
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "APP_TAG=$TAG" >> "$GITHUB_ENV"

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      # Default shell on this runner is pwsh; use $env:VAR (bash $VAR is empty there).
      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --build-name "$env:APP_VERSION" --build-number "$env:GITHUB_RUN_NUMBER"

      - name: Pack
        shell: pwsh
        run: |
          $out = "easyterm-${{ github.ref_name }}-windows-x64.zip"
          tar -a -c -f $out -C build/windows/x64/runner/Release .

      - uses: actions/upload-artifact@v7
        with:
          name: easyterm-${{ github.ref_name }}-windows-x64
          path: easyterm-${{ github.ref_name }}-windows-x64.zip

  build-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-sdk: true

      - name: Set app version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v0.0.3 (got: $TAG)" >&2
            exit 1
          fi
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "APP_TAG=$TAG" >> "$GITHUB_ENV"

      # libserialport (via flutter_libserialport) runs autogen/configure in pod prepare;
      # macos runners do not ship automake/libtool by default.
      - name: Install libserialport build deps
        run: brew install automake libtool

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Pack
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/easyterm-${{ github.ref_name }}-macos-arm64.zip" EasyTerm.app

      - uses: actions/upload-artifact@v7
        with:
          name: easyterm-${{ github.ref_name }}-macos-arm64
          path: easyterm-${{ github.ref_name }}-macos-arm64.zip

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: easyterm-${{ github.ref_name }}-windows-x64
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: easyterm-${{ github.ref_name }}-macos-arm64
          path: release-assets

      # Build bullet notes from commits so in-app update dialogs can preview changes.
      # GitHub's generate_release_notes often yields only a compare link for this repo.
      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          PREV="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          {
            echo "## What's new"
            echo
            if [[ -n "$PREV" ]]; then
              git log --pretty=format:'- %s' --no-merges "${PREV}..${TAG}"
              echo
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            else
              git log --pretty=format:'- %s' --no-merges -20 "${TAG}"
              echo
            fi
          } > release_notes.md
          echo "---- release_notes.md ----"
          cat release_notes.md

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
